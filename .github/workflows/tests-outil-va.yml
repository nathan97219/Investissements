# Lance les tests du calculateur à chaque Pull Request et à chaque push sur dev / master.
# Si un calcul est cassé, la PR affiche une croix rouge : on ne fusionne pas.
name: Tests du calculateur

on:
  pull_request:
    paths: ["outils/value-averaging/**", ".github/workflows/tests-outil-va.yml"]
  push:
    branches: [dev, master]
    paths: ["outils/value-averaging/**", ".github/workflows/tests-outil-va.yml"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: outils/value-averaging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm test
